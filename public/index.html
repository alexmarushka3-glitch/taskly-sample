<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>taskly</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>taskly</h1>
      <form id="add-form">
        <label for="new-title">New task</label>
        <input id="new-title" name="title" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <div id="toolbar">
        <span id="selected-count">0 selected</span>
        <button type="button" id="export-btn" disabled>Copy to file</button>
      </div>
      <p id="error" role="alert" hidden></p>
      <ul id="task-list" aria-label="Tasks"></ul>
      <p id="empty" hidden>No tasks yet.</p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
