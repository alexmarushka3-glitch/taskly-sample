<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>taskly</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>taskly</h1>
      <form id="add-form">
        <label for="new-title">New task</label>
        <input id="new-title" name="title" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <div id="bulk-bar">
        <button id="bulk-skill" type="button" disabled>Create a skill that detects AI</button>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
      <ul id="task-list" aria-label="Tasks"></ul>
      <p id="empty" hidden>No tasks yet.</p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
